name: Build Windows application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Compile-check source
        run: python -m py_compile app.py diagnose_vantage.py

      - name: Run unit and UI regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build unsigned executable
        run: python -m PyInstaller --clean --noconfirm keyboard-effects.spec

      - name: Build installer application folder
        run: python -m PyInstaller --clean --noconfirm --distpath installer-app --workpath build/installer-app keyboard-effects-installer.spec

      - name: Generate unsigned-build checksums
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash -Algorithm SHA256 installer-app/ThrashLighteningControl/ThrashLighteningControl.exe).Hash
          $certHash = (Get-FileHash -Algorithm SHA256 installer/Thrash-Code-Signing.cer).Hash
          @(
            "$exeHash  LenovoLOQBacklitEffects-Thrash.exe"
            "$certHash  Thrash-Code-Signing.cer"
          ) | Set-Content -Encoding ascii installer/SHA256SUMS.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build unsigned compressed installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Hash packaged installer
        shell: pwsh
        run: |
          $setup = "installer-dist/ThrashLighteningControl-Setup-v3.2.0.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash
          "$hash  ThrashLighteningControl-Setup-v3.2.0.exe" | Set-Content -Encoding ascii installer-dist/SHA256SUMS.txt

      - name: Upload unsigned builds
        uses: actions/upload-artifact@v4
        with:
          name: ThrashLighteningControl-v3.2.0-unsigned
          path: |
            dist/ThrashLighteningControl.exe
            installer-dist/ThrashLighteningControl-Setup-v3.2.0.exe
            installer-dist/SHA256SUMS.txt
          if-no-files-found: error
